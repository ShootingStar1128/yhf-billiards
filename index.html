<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>용호패밀리 당구대회</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="badge">YHF BILLIARDS</div>
    <h1>🎱 용호패밀리 당구대회</h1>
    <p>참가자 등록 · 대진 추첨 · 경기 결과 기록</p>
    <a class="primary" href="#players">대회 시작하기</a>
  </header>

  <main>
    <section class="card" id="players">
      <h2>1. 참가자 등록</h2>
      <p class="muted">이름을 입력하고 추가를 눌러주세요.</p>
      <div class="row">
        <input id="playerName" type="text" maxlength="20" placeholder="예: 용호" />
        <button id="addPlayer">추가</button>
      </div>
      <div id="playerList" class="chips"></div>
      <div class="actions">
        <button id="clearPlayers" class="ghost">전체 삭제</button>
        <button id="makeBracket">대진표 만들기</button>
      </div>
    </section>

    <section class="card">
      <h2>2. 대진표</h2>
      <p class="muted">참가자를 등록한 뒤 대진표 만들기를 눌러주세요.</p>
      <div id="bracket" class="bracket empty">아직 대진표가 없습니다.</div>
    </section>

    <section class="card">
      <h2>3. 경기 결과 기록</h2>
      <div class="score-grid">
        <input id="matchTitle" placeholder="경기명 예: 준결승 1경기" />
        <input id="p1" placeholder="선수 1" />
        <input id="s1" type="number" min="0" placeholder="점수" />
        <input id="p2" placeholder="선수 2" />
        <input id="s2" type="number" min="0" placeholder="점수" />
        <button id="saveMatch">결과 저장</button>
      </div>
      <div id="results"></div>
    </section>

    <section class="card rules">
      <h2>대회 안내</h2>
      <ul>
        <li>참가자를 등록하면 자동으로 대진을 섞어줍니다.</li>
        <li>홀수 인원일 경우 한 명은 자동 부전승 처리됩니다.</li>
        <li>경기 결과는 이 휴대폰/브라우저에 자동 저장됩니다.</li>
      </ul>
    </section>
  </main>

  <footer>⚔️ YHF 용호패밀리 ⚔️</footer>
  <script src="app.js"></script>
</body>
</html>
